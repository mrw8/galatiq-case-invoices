[project]
name = "invoice-processor"
version = "0.1.0"
description = "Multi-agent invoice processing automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pdfplumber>=0.10",
    "openai>=1.0",           # For GrokClient (OpenAI-compatible API)
    "python-dateutil>=2.8",
    "rapidfuzz>=3.0",        # Fuzzy matching
    "structlog>=24.0",       # Structured logging
]

# LangGraph integration (optional - uncomment when available)
# langgraph_deps = ["langgraph>=0.2", "langchain-core>=0.2"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
]
ui = [
    "streamlit>=1.35",
]
pdf-gen = [
    "fpdf2>=2.7",
]

[project.scripts]
invoice-processor = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
